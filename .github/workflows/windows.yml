name: Crear instalador de Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Reusar compilaciones anteriores
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Descargar la fuente Rubik (para que funcione sin internet)
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path app/fonts | Out-Null
          Invoke-WebRequest -Uri "https://github.com/google/fonts/raw/main/ofl/rubik/Rubik%5Bwght%5D.ttf" -OutFile app/fonts/Rubik.ttf

      - name: Instalar Tauri
        run: npm install

      - name: Crear los íconos a partir de app/icons/app-icon.png
        run: npx tauri icon app/icons/app-icon.png

      - name: Crear el instalador .exe
        run: npx tauri build

      - name: Guardar el instalador para descargarlo
        uses: actions/upload-artifact@v4
        with:
          name: Cobro-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Leer la versión
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publicar el instalador en Releases (enlace de descarga directo)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Cobro ${{ steps.ver.outputs.version }}
          body: |
            Instalador de Cobro para Windows 10 y 11.
            Descarga el archivo .exe y ábrelo. Si Windows muestra "Windows protegió su PC", toca "Más información" y luego "Ejecutar de todas formas".
          files: src-tauri/target/release/bundle/nsis/*.exe
          make_latest: true
