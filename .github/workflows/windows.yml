name: Crear instaladores (Windows y Android)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Reusar compilaciones anteriores
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Descargar la fuente Rubik (para que funcione sin internet)
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path app/fonts | Out-Null
          Invoke-WebRequest -Uri "https://github.com/google/fonts/raw/main/ofl/rubik/Rubik%5Bwght%5D.ttf" -OutFile app/fonts/Rubik.ttf

      - name: Leer la versión
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Instalar Tauri
        run: npm install

      - name: Crear los íconos a partir de app/icons/app-icon.png
        run: npx tauri icon app/icons/app-icon.png

      - name: Crear y firmar el instalador .exe
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx tauri build

      - name: Comprobar la firma de la actualización
        shell: pwsh
        run: |
          python -m pip install --quiet cryptography
          python .github/verificar_firma.py

      - name: Crear latest.json (lo lee la app para saber si hay versión nueva)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $sig = (Get-Content "$($exe.FullName).sig" -Raw).Trim()
          $notes = (Get-Content .github/notas-version.md -Raw).Trim()
          $data = [ordered]@{
            version   = $v
            notes     = $notes
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $sig
                url       = "https://github.com/${{ github.repository }}/releases/download/v$v/$($exe.Name)"
              }
            }
          }
          $data | ConvertTo-Json -Depth 6 | Set-Content -Path latest.json -Encoding utf8NoBOM
          Get-Content latest.json

      - name: Guardar el instalador para descargarlo
        uses: actions/upload-artifact@v4
        with:
          name: Cobro-Setup
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            latest.json
          if-no-files-found: error

      - name: Publicar en Releases (descarga directa y actualizaciones)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Cobro ${{ steps.ver.outputs.version }}
          body_path: .github/notas-version.md
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            latest.json
          make_latest: true

  android:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar el SDK y el NDK de Android
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "SDK: $ANDROID_HOME"
          echo "NDK: $ANDROID_NDK_LATEST_HOME"
          ls "$ANDROID_HOME/build-tools"

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar Rust para Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Reusar compilaciones anteriores
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Descargar la fuente Rubik (para que funcione sin internet)
        continue-on-error: true
        run: |
          mkdir -p app/fonts
          curl -fsSL -o app/fonts/Rubik.ttf "https://github.com/google/fonts/raw/main/ofl/rubik/Rubik%5Bwght%5D.ttf"

      - name: Leer la versión
        id: ver
        run: echo "version=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")" >> "$GITHUB_OUTPUT"

      - name: Instalar Tauri
        run: npm install

      - name: Crear el proyecto de Android
        run: npx tauri android init --ci

      - name: Crear los íconos (también los de Android)
        run: npx tauri icon app/icons/app-icon.png

      - name: Crear el APK
        run: npx tauri android build --apk --target aarch64 --target armv7 --ci

      - name: Firmar el APK
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then
            echo "::error::Falta el secreto ANDROID_KEYSTORE en GitHub (Settings › Secrets and variables › Actions)."
            exit 1
          fi
          python3 - <<'PY'
          import base64, json, os
          d = json.loads(os.environ["ANDROID_KEYSTORE"])
          open("cobro.p12", "wb").write(base64.b64decode(d["p12"]))
          open("ks-pass.txt", "w").write(d["password"])
          open("ks-alias.txt", "w").write(d.get("alias", "cobro"))
          PY
          KS_PASS="$(cat ks-pass.txt)"; echo "::add-mask::$KS_PASS"; export KS_PASS
          ALIAS="$(cat ks-alias.txt)"
          rm -f ks-pass.txt ks-alias.txt
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          UNSIGNED="$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)"
          echo "APK sin firmar: $UNSIGNED"
          test -n "$UNSIGNED"
          V="${{ steps.ver.outputs.version }}"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" alineado.apk
          "$BT/apksigner" sign --ks cobro.p12 --ks-type PKCS12 --ks-pass env:KS_PASS --ks-key-alias "$ALIAS" --key-pass env:KS_PASS --out "Cobro_${V}_android.apk" alineado.apk
          "$BT/apksigner" verify --print-certs "Cobro_${V}_android.apk" | head -5
          rm -f cobro.p12 alineado.apk
          ls -la "Cobro_${V}_android.apk"

      - name: Crear android.json (lo lee la app del teléfono para saber si hay versión nueva)
        run: |
          python3 - <<'PY'
          import json
          v = "${{ steps.ver.outputs.version }}"
          notes = open(".github/notas-version.md", encoding="utf-8").read().strip()
          data = {"version": v, "url": f"https://github.com/${{ github.repository }}/releases/download/v{v}/Cobro_{v}_android.apk", "notes": notes}
          open("android.json", "w", encoding="utf-8").write(json.dumps(data, ensure_ascii=False, indent=2))
          print(open("android.json", encoding="utf-8").read())
          PY

      - name: Guardar el APK para descargarlo
        uses: actions/upload-artifact@v4
        with:
          name: Cobro-Android
          path: |
            Cobro_*_android.apk
            android.json
          if-no-files-found: error

      - name: Publicar el APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          files: |
            Cobro_*_android.apk
            android.json
