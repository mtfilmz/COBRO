[package]
name = "cobro"
version = "0.7.1"
description = "Cobro · facturación de Super Mobile Tech Repair"
authors = ["Super Mobile Tech Repair"]
edition = "2021"

[lib]
name = "cobro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
base64 = "0.22"

# Solo en Windows (y escritorio): actualización automática y reinicio de la app.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Solo en Android: abrir el menú Compartir con la imagen de la factura.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-compartir = { path = "plugins/compartir" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
